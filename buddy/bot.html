    { id: "ramon", name: "Ramon", color: "#0a84ff" },
    { id: "sarah", name: "Sarah", color: "#ff375f" },
  ];
  function nameOf(id) { return (state.names && state.names[id]) || (id === "sarah" ? "Sarah" : "Ramon"); }
  function person(id) {
    var base = PEOPLE.find(function (p) { return p.id === id; }) || PEOPLE[0];
    return { id: base.id, color: base.color, name: nameOf(base.id) };
  }
  function initial(p) { return (p.name || "?").slice(0, 1).toUpperCase(); }

  /* ---- State: embedded in the page, shared via artifact.publish ------- */
  var LKEY = "bot.spend.local";
  var state = readEmbedded();
  var readOnly = false;

  function readEmbedded() {
    try {
      var d = JSON.parse(document.getElementById("state").textContent);
      ["txns", "recurring", "upcoming"].forEach(function (k) {
        (d[k] || []).forEach(function (r) { if (!r.who) r.who = "ramon"; });
      });
      return d;
    } catch (e) { return { budget: 2000, txns: [], recurring: [], upcoming: [] }; }
  }
  function loadLocal() { try { var r = localStorage.getItem(LKEY); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
  function saveLocal() { try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {} }

  // Resolve the shared-storage capability (memoized by the runtime; null = local only).
  var _art;
  function getArtifact() {
    if (_art !== undefined) return Promise.resolve(_art);
    if (!window.claude || !window.claude.use) { _art = null; return Promise.resolve(null); }
    return window.claude.use("artifact").then(function (a) { _art = a || null; return _art; })
      .catch(function () { _art = null; return null; });
  }

  function persist() {
    try { sessionStorage.setItem("bot.tab", current); } catch (e) {}
    getArtifact().then(function (art) {
      if (!art || readOnly) { saveLocal(); return; }
      art.publish(serialize(state)).catch(function (err) {
        var code = err && err.code;
        if (code === "conflict") return;                 // view reloads to the winner
        if (code === "not_writer" || code === "not_granted" || code === "consent_required" ||
            code === "not_declared" || code === "capability_disabled") {
          readOnly = true; saveLocal(); render();        // become a read-only view
          return;
        }
        saveLocal();                                     // transient — keep a local copy
      });
    });
  }

  // Rebuild the complete page document from state (never serialize live DOM).
  function serialize(s) {
    var json = JSON.stringify(s).replace(/</g, "\\u003c");
    var script = document.getElementById("main").textContent;
    return '<!doctype html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8" />\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />\n' +
      '<meta name="apple-mobile-web-app-capable" content="yes" />\n' +
      '<title>BOT — Bank of Telfer</title>\n' +
      '<style id="bot-css">' + CSS + '</style>\n</head>\n<body>\n' +
      '<div id="root"></div>\n' +
      '<script id="state" type="application/json">' + json + '<\/script>\n' +
      '<script id="main">' + script + '<\/script>\n' +
      '</body>\n</html>';
  }

  /* ---- Helpers -------------------------------------------------------- */
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function dstr(d) { return d.toISOString().slice(0, 10); }
  function todayStr() { return dstr(new Date()); }
  function parseDate(s) { return new Date(s + "T00:00:00"); }
  function symbol() { return (state.currency || "NZ$"); }
  function money(n) { return symbol() + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function money0(n) { return symbol() + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function tint(hex, a) { var n = parseInt(hex.slice(1), 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
  function sameMonth(s) { var d = parseDate(s), n = new Date(); return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth(); }
  function relDate(s) {
    var d = parseDate(s), n = parseDate(todayStr());
    var days = Math.round((d - n) / 86400000);
    if (days === 0) return "Today";
    if (days === 1) return "Tomorrow";
    if (days === -1) return "Yesterday";
    if (days > 1 && days < 7) return "in " + days + " days";
    if (days < 0) return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
    return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  function perMonth(cycle) { return cycle === "weekly" ? 4.33 : cycle === "fortnightly" ? 2.17 : 1; }
  function cycleLabel(cycle) { return cycle === "weekly" ? "Weekly" : cycle === "fortnightly" ? "Fortnightly" : "Monthly"; }
  function addDays(d, n) { var x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function fmtDM(d) { return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }); }
  // The pay cycle window (default fortnightly, anchored to the user's last payday).
  var DEFAULT_ANCHOR = "2026-01-02";
  function payCycle() { return state.payCycle || "fortnightly"; }
  function periodWindow() {
    var today = parseDate(todayStr()), cyc = payCycle();
    if (cyc === "monthly") {
      var s = new Date(today.getFullYear(), today.getMonth(), 1);
      var e = new Date(today.getFullYear(), today.getMonth() + 1, 1);
      return { start: s, end: e, label: s.toLocaleDateString(undefined, { month: "long" }) };
    }
    var days = cyc === "weekly" ? 7 : 14;
    var anchor = parseDate(state.payAnchor || DEFAULT_ANCHOR);
    var k = Math.floor((today - anchor) / 86400000 / days);
    var s2 = addDays(anchor, k * days), e2 = addDays(s2, days);
    return { start: s2, end: e2, label: fmtDM(s2) + " – " + fmtDM(addDays(e2, -1)) };
  }
  function inPeriod(dateStr, w) { var d = parseDate(dateStr); return d >= w.start && d < w.end; }
  function cycleWord() { var c = payCycle(); return c === "weekly" ? "week" : c === "monthly" ? "month" : "fortnight"; }

  /* ---- Rendering ------------------------------------------------------ */
  var viewEl, current;

  function render() {
    if (current === "recurring") renderRecurring();
    else if (current === "upcoming") renderUpcoming();
    else if (current === "settings") renderSettings();
    else renderHome();
  }

  function badge(c) { return '<span class="row-ico"><span class="dot-c" style="background:' + c.color + '"></span></span>'; }
  function avatar(p) { return '<div class="avatar" style="background:' + p.color + '">' + initial(p) + "</div>"; }

  function renderHome() {
    var w = periodWindow();
    var expenses = state.txns.filter(function (t) { return t.type === "expense" && inPeriod(t.date, w); });
    var incomes  = state.txns.filter(function (t) { return t.type === "income"  && inPeriod(t.date, w); });
    var spent = expenses.reduce(function (s, t) { return s + t.amount; }, 0);
    var earned = incomes.reduce(function (s, t) { return s + t.amount; }, 0);
    var saved = earned - spent;
    var usePct = earned > 0 ? Math.min(100, spent / earned * 100) : (spent > 0 ? 100 : 0);

    var byCat = {};
    expenses.forEach(function (t) { byCat[t.cat] = (byCat[t.cat] || 0) + t.amount; });
    var cats = Object.keys(byCat).map(function (id) { return { c: cat(id), amt: byCat[id] }; }).sort(function (a, b) { return b.amt - a.amt; });
    var maxCat = cats.length ? cats[0].amt : 1;

    var cw = cycleWord();
    var html = '<div class="head"><div class="head-sub">Bank of Telfer · ' + esc(w.label) + '</div><h1 class="head-title">This ' + cw + '</h1></div>';
    if (readOnly) html += '<div class="ro-note">View-only — ask the owner to share BOT with you as an editor to add transactions.</div>';

    // Hero: what you saved this pay cycle, with In / Out beneath.
    html += '<div class="hero"><div class="hero-label">Saved this ' + cw + '</div>' +
      '<div class="hero-amount ' + (saved < 0 ? 'neg' : 'pos') + '">' + (saved < 0 ? '−' : '') + money0(Math.abs(saved)) + '</div>' +
      '<div class="flow">' +
        '<div class="flow-item"><div class="flow-k">In</div><div class="flow-v pos">' + money0(earned) + '</div></div>' +
        '<div class="flow-sep"></div>' +
        '<div class="flow-item"><div class="flow-k">Out</div><div class="flow-v">' + money0(spent) + '</div></div>' +
      '</div>' +
      '<div class="budget"><div class="budget-track"><div class="budget-fill" style="width:' + usePct + '%;background:' +
        (spent > earned ? 'var(--spend)' : 'var(--accent)') + '"></div></div>' +
        '<div class="budget-row"><span>' + Math.round(usePct) + '% of income spent</span><span>' +
        (saved >= 0 ? money0(saved) + ' kept' : money0(-saved) + ' over') + '</span></div></div>' +
      '</div>';

    var warns = buildWarnings(earned, spent);
    if (warns.length) {
      html += '<div class="warns">' + warns.map(function (w) {
        return '<div class="warn ' + w.tone + '"><div class="warn-txt">' + w.text + '</div></div>';
      }).join("") + '</div>';
    }

    if (cats.length) {
      html += '<div class="sec-head"><div class="sec-title">Categories</div></div><div class="cats">' + cats.map(function (x) {
        return '<div class="cat-line"><span class="row-ico"><span class="dot-c" style="background:' + x.c.color + '"></span></span>' +
          '<div class="cat-name">' + esc(x.c.name) + '</div><div class="cat-bar"><i style="width:' + (x.amt / maxCat * 100) + '%;background:' + x.c.color + '"></i></div>' +
          '<div class="cat-amt">' + money(x.amt) + '</div></div>';
      }).join("") + '</div>';
    }

    html += '<div class="sec-head"><div class="sec-title">Recent</div></div>';
    var sorted = state.txns.slice().sort(function (a, b) { return b.date < a.date ? -1 : b.date > a.date ? 1 : 0; });
    if (!sorted.length) {
      html += emptyState("No transactions yet", "Tap + to add your first one.");
    } else {
      var groups = {};
      sorted.forEach(function (t) { (groups[t.date] = groups[t.date] || []).push(t); });
      Object.keys(groups).sort().reverse().forEach(function (date) {
        html += '<div class="date-group"><div class="date-label">' + relDate(date) + '</div><div class="list">' + groups[date].map(txnRow).join("") + '</div></div>';
      });
    }
    viewEl.innerHTML = html;
    wireDeletes("[data-del]", function (id) { state.txns = state.txns.filter(function (t) { return t.id !== id; }); });
  }

  function txnRow(t) {
    var c = cat(t.cat);
    var sign = t.type === "income" ? "+" : "−";
    var sub = t.note ? '<div class="txn-sub">' + esc(c.name) + '</div>' : '';
    return '<div class="txn" data-edit="txn:' + t.id + '">' + badge(c) + '<div class="txn-body"><div class="txn-name">' + esc(t.note || c.name) + '</div>' + sub + '</div>' +
      '<div class="txn-amt ' + (t.type === "income" ? "income" : "") + '">' + sign + money(t.amount) + '</div>' +
      (readOnly ? '' : '<button class="txn-del" data-del="' + t.id + '" title="Delete">✕</button>') + '</div>';
  }

  function whoPaidCard(expenses) {
    var totals = {}; PEOPLE.forEach(function (p) { totals[p.id] = 0; });
    expenses.forEach(function (t) { if (totals[t.who] != null) totals[t.who] += t.amount; });
    var a = person(PEOPLE[0].id), b = person(PEOPLE[1].id), av = totals[a.id], bv = totals[b.id];
    var html = '<div class="split">' +
      '<div class="split-person">' + avatar(a) + '<div class="split-amt">' + money0(av) + '</div><div class="split-name">' + esc(a.name) + '</div></div>' +
      '<div class="split-mid"></div>' +
      '<div class="split-person">' + avatar(b) + '<div class="split-amt">' + money0(bv) + '</div><div class="split-name">' + esc(b.name) + '</div></div></div>';
    var diff = Math.abs(av - bv);
    if (diff < 0.5) html += '<div class="settle even">All square</div>';
    else {
      var owes = av > bv ? b : a, owed = av > bv ? a : b;
      html += '<div class="settle"><b>' + esc(owes.name) + '</b> owes <b>' + esc(owed.name) + '</b> ' + money(diff / 2) + ' to even up</div>';
    }
    return html;
  }

  function buildWarnings(earned, spent) {
    var w = [], cw = cycleWord();
    if (earned > 0 && spent > earned) w.push({ tone: "alert", text: "You've spent <b>" + money0(spent - earned) + " more</b> than came in this " + cw + "." });
    else if (earned > 0 && spent / earned >= 0.8) w.push({ tone: "soft", text: "You've spent <b>" + Math.round(spent / earned * 100) + "%</b> of what came in this " + cw + "." });
    var soon = state.upcoming.filter(function (u) { var d = Math.round((parseDate(u.date) - parseDate(todayStr())) / 86400000); return d >= 0 && d <= 7; });
    if (soon.length) { var total = soon.reduce(function (s, u) { return s + u.amount; }, 0); w.push({ tone: "soft", text: "<b>" + money0(total) + "</b> in upcoming costs due within 7 days." }); }
    state.recurring.filter(function (r) { var d = Math.round((parseDate(r.next) - parseDate(todayStr())) / 86400000); return d >= 0 && d <= 1; })
      .forEach(function (r) { w.push({ tone: "soft", text: "<b>" + esc(r.name) + "</b> (" + money0(r.amount) + ") is due " + relDate(r.next).toLowerCase() + "." }); });
    return w;
  }

  function rtype(r) { return r.type || (r.cat === "income" ? "income" : "expense"); }

  function renderRecurring() {
    var outMonthly = 0, inMonthly = 0;
    state.recurring.forEach(function (r) {
      if (rtype(r) === "income") inMonthly += r.amount * perMonth(r.cycle);
      else outMonthly += r.amount * perMonth(r.cycle);
    });
    var n = state.recurring.length;
    var html = '<div class="head"><div class="head-sub">Repeats automatically</div><h1 class="head-title">Recurring</h1></div>';
    html += '<div class="hero"><div class="hero-label">Est. costs / month</div><div class="hero-amount">' + money0(outMonthly) + '</div>' +
      '<div class="hero-meta">' + (inMonthly > 0 ? '<b>+' + money0(inMonthly) + '</b> coming in · ' : '') +
      n + ' recurring' + '</div></div>';
    if (!n) html += emptyState("Nothing recurring", "Add one with + and set Repeat.");
    else {
      var sorted = state.recurring.slice().sort(function (a, b) { return a.next < b.next ? -1 : 1; });
      html += '<div class="list">' + sorted.map(function (r) {
        var c = cat(r.cat), inc = rtype(r) === "income";
        return '<div class="txn" data-edit="recurring:' + r.id + '">' + badge(c) + '<div class="txn-body"><div class="txn-name">' + esc(r.name) +
          '</div><div class="txn-sub">' + cycleLabel(r.cycle) + ' · next ' + relDate(r.next) + '</div></div>' +
          '<div class="txn-amt ' + (inc ? 'income' : '') + '">' + (inc ? '+' : '') + money(r.amount) + '</div>' +
          (readOnly ? '' : '<button class="txn-del" data-delr="' + r.id + '">✕</button>') + '</div>';
      }).join("") + '</div>';
    }
    viewEl.innerHTML = html;
    wireDeletes("[data-delr]", function (id) { state.recurring = state.recurring.filter(function (r) { return r.id !== id; }); });
  }

  function renderUpcoming() {
    var sorted = state.upcoming.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    var total = sorted.reduce(function (s, u) { return s + u.amount; }, 0);
    var html = '<div class="head"><div class="head-sub">One-off future spends</div><h1 class="head-title">Upcoming</h1></div>';
    html += '<div class="hero"><div class="hero-label">Total upcoming</div><div class="hero-amount">' + money0(total) + '</div>' +
      '<div class="hero-meta">' + sorted.length + ' planned</div></div>';
    if (!sorted.length) html += emptyState("Nothing upcoming", "Plan a future cost — add it with + and pick a date.");
    else {
      html += '<div class="list">' + sorted.map(function (u) {
        var c = cat(u.cat);
        return '<div class="txn" data-edit="upcoming:' + u.id + '">' + badge(c) + '<div class="txn-body"><div class="txn-name">' + esc(u.name) +
          '</div><div class="txn-sub">' + relDate(u.date) + ' · ' + c.name + '</div></div>' +
          '<div class="txn-amt">' + money(u.amount) + '</div>' +
          (readOnly ? '' : '<button class="txn-del" data-delu="' + u.id + '">✕</button>') + '</div>';
      }).join("") + '</div>';
    }
    viewEl.innerHTML = html;
    wireDeletes("[data-delu]", function (id) { state.upcoming = state.upcoming.filter(function (u) { return u.id !== id; }); });
  }

  function renderSettings() {
    var ccy = symbol();
    var opts = ["NZ$", "AU$", "US$", "£", "€", "¥", "$"];
    if (opts.indexOf(ccy) === -1) opts.unshift(ccy);
    var d = readOnly ? " disabled" : "";

    var html = '<div class="head"><div class="head-sub">Bank of Telfer</div><h1 class="head-title">Settings</h1></div>';
    if (readOnly) html += '<div class="ro-note">View-only — ask the owner to share BOT with you as an editor to change settings.</div>';

    var cyc = payCycle();
    var cycOpts = [["weekly", "Weekly"], ["fortnightly", "Fortnightly"], ["monthly", "Monthly"]];
    html += '<div class="sec-head"><div class="sec-title">Pay cycle</div></div><div class="rows">';
    html += '<label class="row"><span>Cycle</span><select class="row-input" id="set-cycle"' + d + '>' +
      cycOpts.map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === cyc ? ' selected' : '') + '>' + o[1] + '</option>'; }).join("") + '</select></label>';
    html += '<label class="row"><span>Last payday</span><input class="row-input" id="set-payday" type="date" value="' + (state.payAnchor || DEFAULT_ANCHOR) + '"' + d + ' /></label>';
    html += '</div>';

    html += '<div class="sec-head"><div class="sec-title">Money</div></div><div class="rows">';
    html += '<label class="row"><span>Currency</span><select class="row-input" id="set-cur"' + d + '>' +
      opts.map(function (o) { return '<option' + (o === ccy ? ' selected' : '') + '>' + esc(o) + '</option>'; }).join("") + '</select></label>';
    html += '</div>';

    html += '<div class="sec-head"><div class="sec-title">Categories</div></div><div class="rows" id="cat-editor">';
    html += allCats().map(function (c) {
      var canDel = c.id !== "income" && allCats().length > 2;
      return '<div class="row cat-erow" data-id="' + c.id + '">' +
        '<button class="cat-swatch" data-swatch="' + c.id + '" style="background:' + c.color + '" title="Change colour"' + d + '></button>' +
        '<input class="cat-cname" data-cname="' + c.id + '" maxlength="18" value="' + esc(c.name) + '"' + d + ' />' +
        (canDel ? '<button class="cat-del2" data-catdel="' + c.id + '" title="Delete">✕</button>' : '') +
        '</div>';
    }).join("");
    html += '</div>';
    if (!readOnly) html += '<button class="add-cat-btn" id="add-cat">+ Add category</button>';

    html += '<div class="settings-hint">Changes apply to both of you and sync everywhere BOT is open.</div>';

    viewEl.innerHTML = html;
    if (readOnly) return;

    function commit(fn) { fn(); render(); persist(); }
    var cur = document.getElementById("set-cur");
    cur.addEventListener("change", function () { commit(function () { state.currency = cur.value; }); });
    var cyc = document.getElementById("set-cycle");
    cyc.addEventListener("change", function () { commit(function () { state.payCycle = cyc.value; }); });
    var pd = document.getElementById("set-payday");
    pd.addEventListener("change", function () { commit(function () { if (pd.value) state.payAnchor = pd.value; }); });
    // Editable categories
    function eCat(id) { return ensureCats().find(function (x) { return x.id === id; }); }
    viewEl.querySelectorAll("[data-cname]").forEach(function (el) {
      el.addEventListener("change", function () { commit(function () { var c = eCat(el.getAttribute("data-cname")); if (c) c.name = el.value.trim() || "Category"; }); });
    });
    viewEl.querySelectorAll("[data-swatch]").forEach(function (el) {
      el.addEventListener("click", function () { commit(function () { var c = eCat(el.getAttribute("data-swatch")); if (!c) return; var i = PALETTE.indexOf(c.color); c.color = PALETTE[(i + 1) % PALETTE.length]; }); });
    });
    viewEl.querySelectorAll("[data-catdel]").forEach(function (el) {
      el.addEventListener("click", function () { var id = el.getAttribute("data-catdel"); commit(function () { state.cats = ensureCats().filter(function (x) { return x.id !== id; }); }); });
    });
    var addCat = document.getElementById("add-cat");
    if (addCat) addCat.addEventListener("click", function () {
      commit(function () { var list = ensureCats(); list.push({ id: uid(), name: "New category", color: PALETTE[list.length % PALETTE.length] }); });
    });
  }

  function emptyState(title, sub) {
    return '<div class="empty"><div class="empty-title">' + esc(title) + '</div><div class="empty-sub">' + esc(sub) + '</div></div>';
  }
  function wireDeletes(sel, fn) {
    if (readOnly) return;
    viewEl.querySelectorAll(sel).forEach(function (b) {
      var attr = b.getAttribute("data-del") || b.getAttribute("data-delr") || b.getAttribute("data-delu");
      b.addEventListener("click", function (e) { e.stopPropagation(); fn(attr); render(); persist(); });
    });
    wireEdits();
  }
  function wireEdits() {
    if (readOnly) return;
    viewEl.querySelectorAll(".txn[data-edit]").forEach(function (el) {
      el.addEventListener("click", function (e) {
        if (e.target.closest(".txn-del")) return;
        var parts = el.getAttribute("data-edit").split(":");
        openEdit(parts[0], parts[1]);
      });
    });
  }

  /* ---- Add sheet ------------------------------------------------------ */
  var sheet, scrim, amountEl, noteEl, dateEl, repeatEl, signEl, catGrid;
  var pickedCat = "food", pickedType = "expense", pickedWho = "ramon", editing = null;

  function buildCatGrid() {
    catGrid.innerHTML = allCats().filter(function (c) { return c.id !== "income" || pickedType === "income"; }).map(function (c) {
      return '<button class="cat-pick' + (c.id === pickedCat ? ' active' : '') + '" data-cat="' + c.id + '">' +
        '<span class="dot-c" style="background:' + c.color + '"></span><span>' + esc(c.name) + '</span></button>';
    }).join("");
    catGrid.querySelectorAll("[data-cat]").forEach(function (b) {
      b.addEventListener("click", function () { pickedCat = b.getAttribute("data-cat"); buildCatGrid(); });
    });
    var active = catGrid.querySelector(".cat-pick.active");
    if (active) catGrid.scrollLeft = Math.max(0, active.offsetLeft - 8);
  }
  function setType(type) {
    pickedType = type;
    document.querySelectorAll("#type-seg .seg-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-type") === type); });
    if (type === "income") pickedCat = "income"; else if (pickedCat === "income") pickedCat = firstExpenseCat();
    buildCatGrid();
  }
  function setWho(id) {
    pickedWho = id;
    try { localStorage.setItem("bot.who", id); } catch (e) {}
    document.querySelectorAll("#who-seg .seg-btn").forEach(function (b) { b.classList.toggle("active", b.getAttribute("data-who") === id); });
  }
  function sizeAmount() { amountEl.style.width = Math.max(1, (amountEl.value || "0").length) + "ch"; }
  function showSheet(focus) {
    var curEl = document.getElementById("amount-cur"); if (curEl) curEl.textContent = symbol();
    sizeAmount();
    scrim.classList.remove("hidden"); sheet.classList.remove("hidden"); sheet.scrollTop = 0;
    requestAnimationFrame(function () { scrim.classList.add("show"); sheet.classList.add("show"); });
    if (focus) setTimeout(function () { amountEl.focus(); }, 250);
  }
  function openSheet() {
    if (readOnly) return;
    editing = null;
    document.getElementById("sheet-title").textContent = "New transaction";
    document.getElementById("sheet-save").textContent = "Add";
    document.getElementById("sheet-delete").classList.add("hidden");
    document.getElementById("repeat-row").classList.remove("hidden");
    pickedCat = firstExpenseCat(); amountEl.value = ""; noteEl.value = ""; repeatEl.value = ""; dateEl.value = todayStr();
    setType("expense"); setWho(pickedWho);
    showSheet(true);
  }
  function collFor(kind) { return kind === "recurring" ? state.recurring : kind === "upcoming" ? state.upcoming : state.txns; }
  function openEdit(kind, id) {
    if (readOnly) return;
    var item = collFor(kind).find(function (x) { return x.id === id; });
    if (!item) return;
    editing = { kind: kind, id: id };
    document.getElementById("sheet-title").textContent =
      kind === "recurring" ? "Edit recurring" : kind === "upcoming" ? "Edit upcoming" : "Edit transaction";
    document.getElementById("sheet-save").textContent = "Save";
    document.getElementById("sheet-delete").classList.remove("hidden");
    document.getElementById("repeat-row").classList.toggle("hidden", kind !== "recurring");
    var type = kind === "upcoming" ? "expense" : (item.type || (item.cat === "income" ? "income" : "expense"));
    setType(type);
    pickedCat = item.cat; buildCatGrid();
    setWho(item.who || "ramon");
    amountEl.value = item.amount;
    noteEl.value = (kind === "txn") ? (item.note || "") : (item.name || "");
    dateEl.value = (kind === "recurring") ? item.next : item.date;
    repeatEl.value = (kind === "recurring") ? item.cycle : "";
    showSheet(false);
  }
  function closeSheet() {
    editing = null;
    scrim.classList.remove("show"); sheet.classList.remove("show");
    setTimeout(function () { scrim.classList.add("hidden"); sheet.classList.add("hidden"); }, 300);
  }
  function deleteEditing() {
    if (!editing) return;
    var e = editing;
    if (e.kind === "recurring") state.recurring = state.recurring.filter(function (x) { return x.id !== e.id; });
    else if (e.kind === "upcoming") state.upcoming = state.upcoming.filter(function (x) { return x.id !== e.id; });
    else state.txns = state.txns.filter(function (x) { return x.id !== e.id; });
    closeSheet(); render(); persist();
  }
  function saveTxn() {
    var amt = parseFloat(amountEl.value);
    if (!amt || amt <= 0) { amountEl.focus(); return; }
    var date = dateEl.value || todayStr(), note = noteEl.value.trim();

    if (editing) {
      var e = editing, it = collFor(e.kind).find(function (x) { return x.id === e.id; });
      if (it) {
        if (e.kind === "recurring") { it.amount = amt; it.type = pickedType; it.cat = pickedCat; it.name = note || cat(pickedCat).name; it.cycle = repeatEl.value || it.cycle; it.next = date; it.who = pickedWho; current = "recurring"; }
        else if (e.kind === "upcoming") { it.amount = amt; it.cat = pickedCat; it.name = note || cat(pickedCat).name; it.date = date; it.who = pickedWho; current = "upcoming"; }
        else { it.amount = amt; it.type = pickedType; it.cat = pickedCat; it.note = note; it.date = date; it.who = pickedWho; current = "home"; }
      }
      setActiveTab(current); closeSheet(); render(); persist();
      return;
    }

    var future = parseDate(date) > parseDate(todayStr());
    if (repeatEl.value) { state.recurring.push({ id: uid(), name: note || cat(pickedCat).name, amount: amt, type: pickedType, cat: pickedCat, cycle: repeatEl.value, next: date, who: pickedWho }); current = "recurring"; }
    else if (future && pickedType === "expense") { state.upcoming.push({ id: uid(), name: note || cat(pickedCat).name, amount: amt, cat: pickedCat, date: date, who: pickedWho }); current = "upcoming"; }
    else { state.txns.push({ id: uid(), amount: amt, type: pickedType, cat: pickedCat, note: note, date: date, who: pickedWho }); current = "home"; }
    setActiveTab(current); closeSheet(); render(); persist();
  }
  function setActiveTab(v) { document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("active", t.getAttribute("data-view") === v); }); }

  /* ---- Boot ----------------------------------------------------------- */
  function boot() {
    if (!document.getElementById("bot-css")) {
      var st = document.createElement("style"); st.id = "bot-css"; st.textContent = CSS; document.head.appendChild(st);
    }
    document.getElementById("root").innerHTML = SHELL;
    // reflect custom names on the Paid-by picker
    document.querySelectorAll("#who-seg .seg-btn").forEach(function (b) {
      b.innerHTML = '<i class="who-dot"></i>' + esc(nameOf(b.getAttribute("data-who")));
    });
    viewEl = document.getElementById("view");
    sheet = document.getElementById("sheet"); scrim = document.getElementById("scrim");
    amountEl = document.getElementById("amount"); noteEl = document.getElementById("note");
    dateEl = document.getElementById("date"); repeatEl = document.getElementById("repeat");
    catGrid = document.getElementById("cat-grid");

    try { pickedWho = localStorage.getItem("bot.who") || "ramon"; } catch (e) {}
    try { current = sessionStorage.getItem("bot.tab") || "home"; } catch (e) { current = "home"; }

    document.getElementById("fab").addEventListener("click", openSheet);
    document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
    document.getElementById("sheet-save").addEventListener("click", saveTxn);
    document.getElementById("sheet-delete").addEventListener("click", deleteEditing);
    scrim.addEventListener("click", closeSheet);
    document.querySelectorAll("#type-seg .seg-btn").forEach(function (b) { b.addEventListener("click", function () { setType(b.getAttribute("data-type")); }); });
    document.querySelectorAll("#who-seg .seg-btn").forEach(function (b) { b.addEventListener("click", function () { setWho(b.getAttribute("data-who")); }); });
    amountEl.addEventListener("input", function () { this.value = this.value.replace(/[^0-9.]/g, "").replace(/(\..*)\./g, "$1"); sizeAmount(); });
    document.querySelectorAll(".tab").forEach(function (t) {
      t.addEventListener("click", function () { current = t.getAttribute("data-view"); setActiveTab(current); render(); });
    });

    buildCatGrid();
    setActiveTab(current);
    render();

    // If this view can't reach shared storage, fall back to a local copy.
    getArtifact().then(function (art) {
      if (!art) { var local = loadLocal(); if (local) { state = local; render(); } }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
